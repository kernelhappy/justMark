<!doctype html>
<meta charset="utf-8">
<title>snarkymark</title>
<style>
  :root {
    color-scheme: light dark;
    /* Violet accent: no markup swatch uses it, so selection and the active tool never read as ink. */
    --accent: light-dark(#6553f5, #8f82ff);
    --accent-soft: light-dark(#6553f51f, #8f82ff2e);
    --on-accent: #fff;
    --bg: light-dark(#eceef2, #121317);
    --dot: light-dark(#d3d7de, #262830);
    --surface: light-dark(#ffffffe0, #1f2026e0);
    --solid: light-dark(#fff, #24252c);
    --line: light-dark(#0000001a, #ffffff17);
    --text: light-dark(#1b1d22, #e9eaee);
    --muted: light-dark(#6b7080, #9ca1ad);
    --hover: light-dark(#0000000d, #ffffff12);
    --press: light-dark(#00000017, #ffffff1f);
    --danger: light-dark(#d93a32, #ff6b63);
    --shadow: 0 1px 2px #0000001a, 0 6px 24px light-dark(#0000001f, #00000066);
    --r: 10px;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  [hidden] { display: none !important; }
  body {
    margin: 0; width: fit-content; min-width: 100%; box-sizing: border-box;
    padding: 0 16px 72px; /* bottom: room to scroll the capture clear of the floating dock */ /* sides: a zoomed-in stage overflows, where auto margins give no gutter */
    font: 13px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text);
    background: var(--bg) radial-gradient(var(--dot) 1px, transparent 1.2px) 0 0 / 18px 18px;
    -webkit-font-smoothing: antialiased;
  }
  svg.i { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  button > * { pointer-events: none; } /* clicks land on the button, never its icon */

  /* Buttons */
  button {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; min-width: 34px; padding: 0 8px; border: 0; border-radius: 8px;
    font: inherit; color: inherit; background: transparent; cursor: pointer;
    transition: background-color .12s, color .12s, box-shadow .12s, opacity .12s;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  button:active:not(:disabled) { background: var(--press); }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
  [aria-pressed=true]:is([data-tool], [data-w], [data-fill], #crop) { background: var(--accent-soft); color: var(--accent); }
  .btn { padding: 0 12px; font-weight: 600; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .primary:active:not(:disabled) { background: color-mix(in srgb, var(--accent) 78%, #000); }
  kbd { font-family: inherit; font-size: 11px; font-weight: 600; opacity: .6; }

  /* Tooltips: name, shortcut and hint, after a short hover */
  [data-tip]::after {
    content: attr(aria-label) attr(data-tip); white-space: pre-wrap;
    position: absolute; z-index: 5; left: 50%; top: calc(100% + 8px); translate: -50% -4px;
    width: max-content; max-width: 240px; padding: 6px 9px; border-radius: 7px;
    font-size: 12px; font-weight: 500; line-height: 1.35; text-align: left; color: var(--text); background: var(--solid); box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .12s, translate .12s var(--ease);
  }
  [data-tip]:hover::after { opacity: 1; translate: -50% 0; transition-delay: .45s; }
  .tip-up::after { top: auto; bottom: calc(100% + 8px); translate: -50% 4px; }
  .tip-l::after { left: 0; translate: 0 -4px !important; } .tip-l:hover::after { translate: 0 0 !important; }
  .tip-r::after { left: auto; right: 0; translate: 0 -4px !important; } .tip-r:hover::after { translate: 0 0 !important; }
  .tip-up.tip-r::after { translate: 0 4px !important; } .tip-up.tip-r:hover::after { translate: 0 0 !important; }

  /* Top bar */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--surface); backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid var(--line);
  }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: var(--r); background: var(--hover); }
  .sep { width: 1px; height: 22px; margin: 0 4px; background: var(--line); }
  .grow { flex: 1; }
  .split { display: flex; gap: 1px; }
  .split > :first-child { border-radius: 8px 0 0 8px; }
  .split > :last-child { border-radius: 0 8px 8px 0; min-width: 28px; padding: 0 6px; }
  #fmtlabel { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 5px; border-radius: 4px; background: #ffffff2e; }

  /* Save options */
  #savemenu {
    inset: auto; margin: 6px 0 0; position-area: bottom span-left; position-anchor: --save;
    width: 236px; padding: 10px; border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); background: var(--solid); box-shadow: var(--shadow);
    opacity: 0; translate: 0 -6px; transition: opacity .15s, translate .15s var(--ease), display .15s allow-discrete, overlay .15s allow-discrete;
  }
  #savemenu:popover-open { opacity: 1; translate: 0 0; }
  @starting-style { #savemenu:popover-open { opacity: 0; translate: 0 -6px; } }
  .split { anchor-name: --save; }
  .field { display: grid; gap: 6px; margin-bottom: 10px; }
  .field > span { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .radios { display: flex; padding: 3px; border-radius: 8px; background: var(--hover); }
  .radios label { flex: 1; }
  .radios input { position: absolute; opacity: 0; pointer-events: none; }
  .radios span { display: block; padding: 6px 0; border-radius: 6px; text-align: center; font-weight: 600; cursor: pointer; transition: background-color .12s, box-shadow .12s; }
  .radios span:hover { background: var(--hover); }
  .radios input:checked + span { background: var(--solid); box-shadow: 0 1px 3px #0003; color: var(--accent); }
  #savemenu hr { margin: 2px -10px 6px; border: 0; border-top: 1px solid var(--line); }
  .item { width: 100%; justify-content: flex-start; gap: 10px; }
  .item kbd { margin-left: auto; }

  /* Bottom: contextual style dock (centered) and zoom (right) */
  #bottom {
    position: fixed; left: 16px; right: 16px; bottom: 14px; z-index: 2; pointer-events: none;
    display: grid; grid-template-columns: 1fr auto minmax(max-content, 1fr); align-items: end; gap: 12px;
  }
  .pill {
    display: flex; align-items: center; gap: 2px; padding: 5px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); backdrop-filter: blur(16px) saturate(1.4); box-shadow: var(--shadow); pointer-events: auto;
  }
  #props { grid-column: 2; gap: 14px; padding: 5px 8px; transition: opacity .18s, translate .22s var(--ease); }
  #props[data-k=""] { opacity: 0; translate: 0 12px; pointer-events: none; }
  #props .g { display: none; align-items: center; gap: 2px; }
  #props[data-k~=c] .g-c, #props[data-k~=w] .g-w, #props[data-k~=f] .g-f, #props[data-k~=s] .g-s, #props[data-k~=d] .g-d { display: flex; }
  body:has(#stage.cropping) #props { opacity: 1; translate: 0 0; pointer-events: auto; }
  body:has(#stage.cropping) #props .g { display: none; }
  body:has(#stage.cropping) #props .g-crop { display: flex; gap: 6px; }
  .hint { padding: 0 6px 0 4px; color: var(--muted); }
  #zoombar { grid-column: 3; justify-self: end; }
  /* Too narrow for dock + zoom on one row (~700px with a rect selected): stack zoom above the dock. */
  @media (max-width: 760px) {
    #bottom { grid-template-columns: 1fr; }
    #props { grid-column: 1; grid-row: 2; justify-self: center; }
    #zoombar { grid-column: 1; grid-row: 1; }
  }
  #zoom { min-width: 52px; font-variant-numeric: tabular-nums; font-weight: 600; }
  [data-c] { min-width: 30px; width: 30px; padding: 0; }
  [data-c]::before {
    content: ""; width: 20px; height: 20px; border-radius: 50%; background: var(--c);
    box-shadow: inset 0 0 0 1px light-dark(#0000002e, #ffffff40); transition: box-shadow .15s, scale .15s var(--ease);
  }
  [data-c][aria-pressed=true]::before { box-shadow: inset 0 0 0 1px #0003, 0 0 0 2px var(--solid), 0 0 0 4px var(--accent); scale: .9; }
  [data-w] i { display: block; width: 18px; border-radius: 2px; background: currentColor; }
  [data-del]:hover:not(:disabled) { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  #tsize { min-width: 24px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .aa { font-weight: 700; }

  /* Status toast */
  #status {
    position: fixed; left: 50%; bottom: 76px; z-index: 3; translate: -50% 0; width: max-content; max-width: calc(100vw - 48px);
    padding: 8px 14px; border-radius: 999px; font-weight: 600; color: var(--solid); background: var(--text); box-shadow: var(--shadow);
    transition: opacity .2s, translate .25s var(--ease); cursor: default;
  }
  #status:empty, #status.off { opacity: 0; translate: -50% 8px; pointer-events: none; }

  /* Stage */
  #stage {
    position: relative; width: fit-content; margin: 16px auto; touch-action: none; user-select: none; cursor: crosshair;
    box-shadow: 0 0 0 1px var(--line), 0 2px 6px #0000001f, 0 12px 40px light-dark(#00000024, #00000080);
  }
  #shot { display: block; pointer-events: none; } /* never the target: Chrome's image menu and drag-out would hand over the unredacted capture */
  #stage[data-tool=select] { cursor: default; }
  #stage[data-tool=text] { cursor: text; }
  #stage.cropping { overflow: clip; cursor: crosshair; }
  #ink { position: absolute; inset: 0; }
  #stage.cropping #ink { pointer-events: none; }
  #ink svg { display: block; width: 100%; height: 100%; }
  .box { position: absolute; }
  .box i { position: absolute; width: 12px; height: 12px; box-sizing: border-box; border-radius: 3px; background: #fff; border: 1.5px solid var(--accent); box-shadow: 0 1px 3px #0005; cursor: move; }
  .box [data-h*=n] { top: 0; } .box [data-h*=s] { bottom: 0; } .box [data-h*=w] { left: 0; } .box [data-h*=e] { right: 0; }
  .box [data-h=n], .box [data-h=s] { left: calc(50% - 6px); cursor: ns-resize; }
  .box [data-h=e], .box [data-h=w] { top: calc(50% - 6px); cursor: ew-resize; }
  .box [data-h=nw], .box [data-h=se] { cursor: nwse-resize; }
  .box [data-h=ne], .box [data-h=sw] { cursor: nesw-resize; }
  #sel { outline: 1.5px solid #fff; box-shadow: 0 0 0 1000000px #000000a0; /* 100vmax fell short: a 32767px capture at 8x zoom is ~262000px */ cursor: move; }
  #sel i { border-color: #fff; background: #fff; }
  #pick { outline: 1.5px solid var(--accent); pointer-events: none; }
  #pick.ends { outline: none; }
  #pick i { pointer-events: auto; }
  #pick [data-h="0"], #pick [data-h="1"], #pick [data-h=tip] { border-radius: 50%; }
  /* Outside the shape, so a small one (Fit zoom) can still be grabbed inside to move it. */
  #pick [data-h*=n] { top: -12px; } #pick [data-h*=s] { bottom: -12px; } #pick [data-h*=w] { left: -12px; } #pick [data-h*=e] { right: -12px; }
  #edit { position: absolute; margin: 0; padding: 0; border: 0; outline: 1.5px solid var(--accent); border-radius: 2px; background: #fffc; resize: none; overflow: hidden; white-space: pre; field-sizing: content; min-width: 2ch; user-select: text; }
  #printshot { display: none; }
  @media print {
    header, #bottom, #status, #savemenu, #sel, #pick, #edit { display: none !important; }
    body { background: none; padding: 0 !important; }
    #stage { margin: 0; box-shadow: none; }
    #shot, #printshot { width: var(--actual, auto) !important; max-width: 100%; }
    .burned #stage { display: none; }
    .burned #printshot { display: block; }
  }
</style>

<header id="tools">
  <div class="seg">
    <button data-tool="select" data-key="V" aria-label="Select" data-tip=" · V&#10;Drag to move, handles resize, double-click text to edit, Del deletes" class="tip-l"><svg class="i"><use href="#i-select"/></svg></button>
    <button data-tool="hl" data-key="H" aria-label="Highlighter" data-tip=" · H&#10;Shift: straight, snapped to 45°"><svg class="i"><use href="#i-hl"/></svg></button>
    <button data-tool="pen" data-key="P" aria-label="Pen" data-tip=" · P&#10;Shift: straight, snapped to 45°"><svg class="i"><use href="#i-pen"/></svg></button>
    <button data-tool="line" data-key="L" aria-label="Line" data-tip=" · L&#10;Shift: snap to 45°"><svg class="i"><use href="#i-line"/></svg></button>
    <button data-tool="arrow" data-key="A" aria-label="Arrow" data-tip=" · A&#10;Shift: snap to 45°"><svg class="i"><use href="#i-arrow"/></svg></button>
    <button data-tool="rect" data-key="R" aria-label="Rectangle" data-tip=" · R&#10;Shift: square. Filled black redacts."><svg class="i"><use href="#i-rect"/></svg></button>
    <button data-tool="ellipse" data-key="E" aria-label="Ellipse" data-tip=" · E&#10;Shift: circle"><svg class="i"><use href="#i-ellipse"/></svg></button>
    <button data-tool="cloud" data-key="C" aria-label="Cloud" data-tip=" · C"><svg class="i"><use href="#i-cloud"/></svg></button>
    <button data-tool="text" data-key="T" aria-label="Text" data-tip=" · T&#10;Click to place; click away or Esc to finish"><svg class="i"><use href="#i-text"/></svg></button>
    <button data-tool="callout" data-key="B" aria-label="Callout" data-tip=" · B&#10;Drag from the point to where the text goes"><svg class="i"><use href="#i-callout"/></svg></button>
  </div>
  <span class="sep"></span>
  <button id="crop" data-key="X" aria-pressed="false" aria-label="Crop" data-tip=" · X&#10;Drag to pick the area to keep; Enter applies, Esc cancels"><svg class="i"><use href="#i-crop"/></svg></button>
  <button id="uncrop" hidden aria-label="Undo crop" data-tip="&#10;Back to the full capture"><svg class="i"><use href="#i-uncrop"/></svg></button>
  <span class="grow"></span>
  <button data-cmd="undo" aria-label="Undo" data-tip=" · Ctrl+Z"><svg class="i"><use href="#i-undo"/></svg></button>
  <button data-cmd="redo" aria-label="Redo" data-tip=" · Ctrl+Y"><svg class="i"><use href="#i-redo"/></svg></button>
  <span class="sep"></span>
  <button class="btn" data-act="copy" aria-label="Copy" data-tip=" as PNG · Ctrl+C&#10;Markup included" ><svg class="i"><use href="#i-copy"/></svg><span>Copy</span></button>
  <div class="split">
    <button class="btn primary tip-r" data-act="save" aria-label="Save" data-tip=" · Ctrl+S"><svg class="i"><use href="#i-save"/></svg><span>Save</span><span id="fmtlabel">PNG</span></button>
    <button class="primary tip-r" popovertarget="savemenu" aria-label="Format, quality and Print" data-tip=""><svg class="i"><use href="#i-down"/></svg></button>
  </div>
</header>

      <div class="radios">
        <label><input type="radio" name="format" value="png" checked><span>PNG</span></label>
        <label><input type="radio" name="format" value="jpg"><span>JPG</span></label>
        <label><input type="radio" name="format" value="pdf"><span>PDF</span></label>
      </div>
    </div>
    <div class="field" id="qfield"><span>Quality</span>
      <div class="radios">
        <label><input type="radio" name="quality" value="0.92" checked><span>High</span></label>
        <label><input type="radio" name="quality" value="0.8"><span>Medium</span></label>
        <label><input type="radio" name="quality" value="0.6"><span>Low</span></label>
      </div>

  <button class="item" data-act="print" popovertarget="savemenu" popovertargetaction="hide"><svg class="i"><use href="#i-print"/></svg><span>Print…</span><kbd>Ctrl+P</kbd></button>
</div>
